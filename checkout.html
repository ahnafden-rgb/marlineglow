<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout – Marline Glow</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0a2a2e;--mid:#0d3d44;--gold:#c9a227;--gl:#e8c84a;--cream:#fdf8ec;--mut:#a8c4c9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 70% 0,#1a5c68 0,transparent 60%),var(--teal);color:var(--cream);font-family:'Cormorant Garamond',serif;min-height:100vh;padding:24px 5% 60px}
a{color:var(--gold)}.top{max-width:1000px;margin:0 auto 28px;display:flex;justify-content:space-between;align-items:center;font:500 11px Montserrat,sans-serif;letter-spacing:2px;text-transform:uppercase}
.brand{font:700 20px Cinzel,serif;letter-spacing:3px;color:var(--gold);text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
.box{background:rgba(13,61,68,.45);border:1px solid rgba(201,162,39,.2);padding:28px}
h1{font:600 28px Cinzel,serif;margin-bottom:22px}h2{font:600 15px Cinzel,serif;letter-spacing:2px;color:var(--gold);margin:22px 0 12px}
label{display:block;font:500 10px Montserrat,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;background:rgba(10,42,46,.7);border:1px solid rgba(201,162,39,.3);color:var(--cream);font:17px 'Cormorant Garamond',serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:84px;resize:vertical}
.row{display:flex;justify-content:space-between;font:500 12px Montserrat,sans-serif;letter-spacing:1px;padding:9px 0;border-bottom:1px solid rgba(201,162,39,.12)}
.row.t{color:var(--gl);font-weight:600;border:none}.it{padding:10px 0;border-bottom:1px solid rgba(201,162,39,.12);font-size:16px}.it small{color:var(--gold);font:500 9px Montserrat,sans-serif;letter-spacing:2px;text-transform:uppercase;display:block}
.pay{background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.4);padding:16px;margin:14px 0;font-size:17px;line-height:1.6}.pay b{color:var(--gl)}
.btn{width:100%;margin-top:22px;padding:17px;border:none;cursor:pointer;background:linear-gradient(135deg,#8a6a0a,#c9a227,#e8c84a);color:var(--teal);font:600 11px Montserrat,sans-serif;letter-spacing:2.5px;text-transform:uppercase}
.btn.wa{background:#25D366;color:#fff;display:block;text-align:center;text-decoration:none}
.err{color:#ff9d9d;font:500 12px Montserrat,sans-serif;margin-top:12px;display:none}
.ok{max-width:560px;margin:60px auto;text-align:center}.ok h1{color:var(--gl)}.ok p{font-size:19px;line-height:1.7;color:var(--mut);margin:12px 0}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.box{padding:20px}}
</style></head><body>
<div class="top"><a class="brand" href="index.html">MARLINE GLOW</a><a href="shop.html">← Keep shopping</a></div>
<div id="app"></div>
<script src="cart.js"></script>
<script>
const C=MG_CFG,app=document.getElementById('app'),esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const cart=MG.get();
if(!cart.length){app.innerHTML='<div class="ok"><h1>Your cart is empty</h1><p>Add some products first.</p><a class="btn" style="display:block;text-decoration:none;text-align:center" href="shop.html">Go to shop</a></div>'}
else{
const sub=MG.subtotal(cart),unp=cart.some(i=>!i.price||i.note);
app.innerHTML=`<div class="wrap"><form class="box" id="f"><h1>Checkout</h1>
<label>Full name</label><input name="name" required>
<label>Phone number</label><input name="phone" required inputmode="tel" placeholder="01XXXXXXXXX" pattern="01[0-9]{9}" title="11-digit Bangladeshi number">
<label>Delivery area</label><select name="zone" id="zone"><option value="d">Inside Dhaka</option><option value="o">Outside Dhaka</option></select>
<label>Full address</label><textarea name="address" required placeholder="House, road, area, district"></textarea>
<label>Note (optional)</label><input name="note">
<h2>Pay delivery charge now</h2>
<div class="pay">Cash on delivery for products. Please send the delivery charge <b id="feeA"></b> in advance via <b>bKash or Nagad (Send Money)</b> to <b>${C.PAY_NUMBER}</b>, then fill in the details below.</div>
<label>Paid via</label><select name="method"><option>bKash</option><option>Nagad</option></select>
<label>Number you sent from</label><input name="sender" required inputmode="tel" pattern="01[0-9]{9}">
<label>Transaction ID (TrxID)</label><input name="trx" required minlength="6" style="text-transform:uppercase">
<div class="err" id="err"></div><button class="btn" id="sb">Place Order</button></form>
<div class="box"><h2 style="margin-top:0">Order summary</h2>${cart.map(i=>`<div class="it"><small>${esc(i.brand)}</small>${i.qty}× ${esc(i.name)} <span style="float:right">${i.price?MG.fmt(i.price*i.qty):'TBC'}</span></div>`).join('')}
<div class="row"><span>Subtotal (pay on delivery)</span><span>${MG.fmt(sub)}${unp?'+':''}</span></div>
<div class="row"><span>Delivery charge (pay now)</span><span id="feeB"></span></div>
${unp?'<p style="margin-top:12px;font-size:15px;color:var(--mut);font-style:italic">Some items have sizes or prices we will confirm with you on WhatsApp before delivery.</p>':''}</div></div>`;
const fee=()=>document.getElementById('zone').value==='d'?C.DHAKA_FEE:C.OUTSIDE_FEE;
const upd=()=>{feeA.textContent=feeB.textContent=MG.fmt(fee())};upd();zone.onchange=upd;
f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),sb=document.getElementById('sb');
 const o={id:'MG'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.floor(1000+Math.random()*9000),name:d.name,phone:d.phone,zone:d.zone==='d'?'Inside Dhaka':'Outside Dhaka',address:d.address,note:d.note,
 items:cart.map(i=>`${i.qty}x ${i.brand} ${i.name} - ${i.price?MG.fmt(i.price*i.qty):'price TBC'}${i.note?' ('+i.note+')':''}`).join('\n'),subtotal:MG.fmt(sub)+(unp?'+ (some TBC)':''),fee:MG.fmt(fee()),method:d.method,sender:d.sender,trx:d.trx.toUpperCase()};
 sb.disabled=true;sb.textContent='Placing order…';
 try{if(C.SCRIPT_URL){await fetch(C.SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)})}else console.warn('SCRIPT_URL not set: order was not saved to Google Sheet')}
 catch(x){err.style.display='block';err.textContent='Could not place the order. Check your internet and try again.';sb.disabled=false;sb.textContent='Place Order';return}
 const msg=`*New Order ${o.id}*\nName: ${o.name}\nPhone: ${o.phone}\nArea: ${o.zone}\nAddress: ${o.address}\n\n${o.items}\n\nSubtotal (cash on delivery): ${o.subtotal}\nDelivery charge paid: ${o.fee} via ${o.method}\nFrom: ${o.sender}  TrxID: ${o.trx}${o.note?'\nNote: '+o.note:''}`;
 MG.clear();
 app.innerHTML=`<div class="ok"><h1>Thank you!</h1><p>Your order <b style="color:var(--gl)">${o.id}</b> has been received.</p><p>We will verify your delivery-charge payment and confirm your order shortly. Please tap below to send your order details to us on WhatsApp so we can confirm faster.</p><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${C.WA}?text=${encodeURIComponent(msg)}">Send order on WhatsApp</a><p><a href="index.html">Back to home</a></p></div>`;
};}
</script></body></html>
